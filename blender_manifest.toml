schema_version = "1.0.0"

id = "real_terrain_generator"
version = "0.1.0"
name = "Real Terrain Generator"
tagline = "Generate 3D terrains from real-world Digital Elevation Models (DEM)"
maintainer = "Miguel Diaz de Leon-Munoz <migueldlm1307@gmail.com>"
type = "add-on"

tags = ["Add Mesh", "Modeling", "Terrain"]

blender_version_min = "4.2.0"

description = """
Real Terrain Generator creates accurate 3D terrains from real-world elevation data:
- Free global elevation from AWS Terrain Tiles (no API key) or OpenTopography (Copernicus, ALOS, SRTM).
- Place name search (Nominatim / OpenStreetMap) and latitude / longitude input with metric area size.
- Fit-to-size, real 1:1 or map-ratio scale, with live vertical exaggeration.
- Terrain masks as vertex groups and a color attribute: vegetation, water flow, wetness, scree, snow, ruggedness.
- Real geology from Macrostrat geologic maps and a procedural rock / soil / snow material (EEVEE and Cycles).
- 16-bit heightmap export with real-scale metadata (File > Export).
"""

license = ["SPDX:GPL-3.0-or-later"]

platforms = ["windows-x64", "macos-arm64", "macos-x64", "linux-x64"]

[permissions]
network = "Fetch elevation tiles (AWS Open Data, OpenTopography), geologic maps (Macrostrat) and geocoding (Nominatim)"
files = "Cache downloaded elevation tiles and export 16-bit heightmaps"
